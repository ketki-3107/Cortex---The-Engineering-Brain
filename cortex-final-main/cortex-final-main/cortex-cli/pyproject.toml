[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-cli"
version = "1.0.0"
description = "CLI for CORTEX — Engineering Intelligence Platform. Syncs, validates, and reports on architectural decision memories across projects."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "CORTEX Team"},
]
dependencies = [
    "python-gitlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
cortex = "cortex_cli.cli:main"

[tool.setuptools.packages.find]
include = ["cortex_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]