name: "CORTEX — Living Organisational Record Engine"
description: "Multi-agent institutional memory system powered by Anthropic Claude's semantic reasoning. A triage router inspects context and dispatches to six specialised agents — SPECFORGE (failure prediction & specs), GUARDKEEPER (conflict detection, promise checking & security sentinel), REPLY_HANDLER (live memory evolution via cortex: commands), CORTEXKEEPER (decision extraction & carbon estimation), CORTEXCAST (health audits & knowledge graphs), and ONBOARDING (new-member briefing). Decision dependency tracking with cascading impact analysis. Zero manual effort."
public: true

definition:
  version: "v1"
  environment: ambient

  # ──────────────────────────────────────────────────────────────────
  #  COMPONENTS — eight agents, one entry-point router + seven workers
  # ──────────────────────────────────────────────────────────────────
  components:
    # ── 1. TRIAGE ROUTER ──────────────────────────────────────────
    - name: "triage_router"
      type: AgentComponent
      prompt_id: "triage_router_prompt"
      inputs:
        - from: "context:goal"
          as: "user_goal"
        - from: "context:project_id"
          as: "project_id"
      toolset:
        - "get_merge_request"
        - "get_issue"
        - "list_issue_notes"
        - "list_all_merge_request_notes"
      ui_log_events:
        - "on_agent_final_answer"
        - "on_tool_execution_success"
